name: publish

# Publishing requires explicit acceptance for the exact main commit.
# CI fixtures prove host compatibility; they do not prove real generation or settlement.
on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Full main commit that passed real generation, replay and settlement acceptance
        required: true
        type: string
      acceptance_reference:
        description: Private acceptance receipt reference (never include keys, prompts or media URLs)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  registry:
    if: github.repository == 'CuddlerAI/comfyui-cuddler' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require accepted commit and successful host and unit workflows
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
          ACCEPTANCE_REFERENCE: ${{ inputs.acceptance_reference }}
        run: |
          test "$ACCEPTED_SHA" = "$GITHUB_SHA"
          test -n "$ACCEPTANCE_REFERENCE"
          for workflow in test.yml host.yml; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')
            test "$conclusion" = success || { echo "$workflow has not passed for this main commit"; exit 1; }
          done
      - name: Publish only from 1.0.0 on
        id: gate
        run: |
          # Fail closed: the version as TOML reads it, and only a plain X.Y.Z of 1.0.0 or above publishes.
          # A pyproject.toml that does not parse stops the job here.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "pyproject version: $version"
          if [[ "$version" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to the Comfy Registry
        if: steps.gate.outputs.publish == 'true'
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main on 2025-05-10
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
