[project]
name = "cuddler"
version = "1.0.0"
description = "Generate video, images, speech and music in ComfyUI with your Cuddler Platform API key. Prices are shown before you run, and every run has a spending limit."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/CuddlerAI/comfyui-cuddler"
Documentation = "https://github.com/CuddlerAI/comfyui-cuddler#readme"
"Bug Tracker" = "https://github.com/CuddlerAI/comfyui-cuddler/issues"

[tool.comfy]
PublisherId = "cuddler"
DisplayName = "Cuddler"
Icon = "https://raw.githubusercontent.com/CuddlerAI/comfyui-cuddler/main/assets/icon.png"
requires-comfyui = ">=0.14.0"
